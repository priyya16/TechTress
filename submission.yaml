submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"

  problem_statement: >
    Pharmaceutical companies face challenges in manually reviewing large volumes
    of adverse-event reports and ensuring regulatory submission dossiers contain
    the required ICH M4 CTD sections. Missing emerging safety signals or
    incomplete dossiers can delay regulatory action and drug approvals.

  solution_summary: >
    We are building an AI-powered solution with two modes: Signal Detection,
    which analyzes adverse-event reports, clusters similar events, and calculates
    Proportional Reporting Ratio (PRR) statistics to flag potential safety
    signals; and Submission Readiness, which checks a dossier outline against
    ICH M4 CTD requirements, provides module-wise completeness scores, and
    generates a regulatory gap report.

  key_features:
    - "Adverse-event clustering to identify emerging safety patterns"
    - "Proportional Reporting Ratio (PRR) calculation for potential safety signals"
    - "ICH M4 CTD-based dossier completeness checking"
    - "Module-wise completeness scoring and regulatory gap report"
    - "AI-powered summaries and recommendations for reviewers"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "Pandas", "Scikit-learn"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["Git", "GitHub Actions"]

  what_we_are_most_proud_of: >
    Our strongest aspect is combining drug safety signal detection and regulatory
    submission readiness into one solution, allowing users to identify potential
    safety concerns and assess dossier completeness through a unified workflow.

  known_limitations: >
    The prototype uses a limited representative adverse-event dataset rather
    than the complete FAERS database and evaluates dossier readiness from an
    available dossier outline rather than a full regulatory submission package.
    Results are intended to support human review and not replace qualified
    regulatory or medical assessment.

