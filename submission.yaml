submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Pharmacovigilance and regulatory-affairs reviewers must screen very large
    adverse-event collections such as FDA FAERS and assemble ICH M4 CTD dossiers
    that span five modules. Manual review makes emerging safety signals easy to
    miss and incomplete dossier sections easy to overlook, which can delay
    regulatory action.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    TechTress built a local Streamlit prototype with two modes: PRR/ROR/chi-square
    screening plus TF-IDF clustering, LDA topics, and Isolation Forest ranking,
    and a representative ICH M4 CTD completeness checker. All ML runs locally
    with scikit-learn; no external AI API is required at runtime.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "TF-IDF/KMeans clustering, LDA topics, and cosine similar-narrative search"
    - "2x2 PRR plus ROR and chi-square, with Isolation Forest reviewer ranking"
    - "Potential safety-signal tables, charts, and CSV export"
    - "Representative ICH M4 CTD mapping with module-wise completeness scoring"
    - "Downloadable gap report with rule-based reviewer explanations"

  tech_stack:
    languages: ["Python"]              # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit", "Pandas", "NumPy", "scikit-learn", "Plotly"]
    ibm_technologies: ["IBM Bob"]      # development workflow only; not a runtime service
    databases: []
    other: ["Git", "GitHub", "GitHub Actions", "pytest"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The same reviewer workspace combines statistically correct PRR screening
    (including explicit invalid-calculation handling) with an honest CTD
    readiness score. We did not invent medical conclusions or claim a complete
    regulatory checklist.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    This is a prototype. Sample or synthetic data may be used and is not the
    complete FDA FAERS database. The tool does not replace pharmacovigilance
    experts and is not a certified medical or regulatory compliance system.
    The CTD checklist is representative rather than exhaustive. IBM Bob was
    used in development, not as a production inference backend.

